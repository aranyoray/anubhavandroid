name: CI

# Builds an installable APK and runs the tests on GitHub's runners, which have the Android
# SDK and access to Google's Maven repository. This is the only place the Android app is
# actually compiled — grab the APK from a run's Artifacts to sideload it on a phone.
#
#   * Android job: assembles a debug APK (signed with the debug key, installs directly) and
#     runs the JVM unit tests. The APK is uploaded even if the tests fail, so a test flake
#     never blocks getting a build onto a phone.
#   * API job: runs the FastAPI test suite (api/tests), which needs no database.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# One run per branch; a new push cancels the one still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # packages:'' — the action's default installs the withdrawn "tools" package and fails;
      # platform-tools is already on the image and the packages this build needs are installed
      # in the next step.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install SDK packages
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null
          yes | sdkmanager --licenses >/dev/null || true

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug \
            -PRAZORPAY_KEY_ID="${{ secrets.RAZORPAY_KEY_ID }}"

      - name: Name the APK
        id: apk
        if: always()
        run: |
          src="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$src" ]; then
            out="anubhav-debug-$(git rev-parse --short HEAD).apk"
            cp "$src" "$out"
            echo "path=$out" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK artifact
        if: always() && steps.apk.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: anubhav-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: warn

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          # TestClient (starlette) needs httpx; requirements pins the httpx2 fork for the app.
          pip install pytest httpx

      - name: Run API tests
        run: python -m pytest api/tests -q
